[package]
name = "safelight-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Safelight's Swift-facing API: RAWmakase's crates for the iPad app"
publish = false

[lib]
# staticlib for the app; cdylib only so uniffi-bindgen can read the API from it.
crate-type = ["staticlib", "cdylib", "lib"]
name = "safelight_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
# RAWmakase's crates, from the fork's ios/build-crates branch, checked out
# as the vendor/rawmakase submodule at the commit this repository pins.
rawmakase-cancel = { path = "../vendor/rawmakase/crates/rawmakase-cancel" }
rawmakase-inference = { path = "../vendor/rawmakase/crates/rawmakase-inference" }
rawmakase-catalog = { path = "../vendor/rawmakase/crates/rawmakase-catalog" }
rawmakase-decode = { path = "../vendor/rawmakase/crates/rawmakase-decode" }
rawmakase-engine = { path = "../vendor/rawmakase/crates/rawmakase-engine" }
rawmakase-export = { path = "../vendor/rawmakase/crates/rawmakase-export" }
rawmakase-interop = { path = "../vendor/rawmakase/crates/rawmakase-interop" }
rawmakase-model = { path = "../vendor/rawmakase/crates/rawmakase-model" }
rawmakase-protocol = { path = "../vendor/rawmakase/crates/rawmakase-protocol" }
anyhow = "1"
# Lensfun's database installer (src/lensfun_install), at the versions
# RAWmakase's workspace uses: the archive comes as a .tar.bz2, read in pure
# Rust, and over HTTPS only.
sha2 = "0.11"
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
bzip2-rs = "0.1"
tar = { version = "0.4", default-features = false }
# mmap and munmap for image-sized blocks (src/alloc.rs).
libc = "0.2"
bytemuck = "1"
# Thumbnails: resized and encoded as JPEG, at the version the decoder uses.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
pollster = "1"
# The GPU renderer's backend: the desktop app turns Metal on through eframe;
# without a backend wgpu has nothing to start. Same version as the engine's.
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
thiserror = "2"
# Export presets, kept as the desktop's export settings.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AI Denoise on the Neural Engine: Core ML, called directly (src/neural_denoise.rs).
half = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLModel", "MLModelConfiguration", "MLModelDescription", "MLModelMetadataKeys", "MLMultiArray"] }

[dev-dependencies]
tempfile = "3"
# Lensfun's stand-in database (src/lensfun.rs).
rawmakase-model = { path = "../vendor/rawmakase/crates/rawmakase-model", features = ["test-support"] }
# AI Denoise's test fixtures (src/from_desktop/ai_denoise/tests.rs).
rawmakase-decode = { path = "../vendor/rawmakase/crates/rawmakase-decode", features = ["test-support"] }
# Reading the desktop's renders in the compatibility test (src/compat.rs).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[profile.release]
lto = "thin"
# Xcode strips the app; leaving it to Xcode also avoids rust-objcopy, which
# fails to start in some rustup installs.
strip = false
