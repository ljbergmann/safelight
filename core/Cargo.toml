[package]
name = "rawmakase-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "RAWmakase's Swift-facing API for the iPad app"
publish = false

[lib]
# staticlib for the app; cdylib only so uniffi-bindgen can read the API from it.
crate-type = ["staticlib", "cdylib", "lib"]
name = "rawmakase_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
# RAWmakase's crates from the fork checkout next to this repository
# (branch ios/build-crates of ljbergmann/rawmakase).
rawmakase-cancel = { path = "../../rawmakase-ios/crates/rawmakase-cancel" }
rawmakase-decode = { path = "../../rawmakase-ios/crates/rawmakase-decode" }
rawmakase-engine = { path = "../../rawmakase-ios/crates/rawmakase-engine" }
rawmakase-interop = { path = "../../rawmakase-ios/crates/rawmakase-interop" }
rawmakase-model = { path = "../../rawmakase-ios/crates/rawmakase-model" }
rawmakase-protocol = { path = "../../rawmakase-ios/crates/rawmakase-protocol" }
anyhow = "1"
# The GPU renderer's backend: the desktop app turns Metal on through eframe;
# without a backend wgpu has nothing to start. Same version as the engine's.
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
thiserror = "2"

[profile.release]
lto = "thin"
# Xcode strips the app; leaving it to Xcode also avoids rust-objcopy, which
# fails to start in some rustup installs.
strip = false
