name: Rawmakase
options:
  bundleIdPrefix: com.ljbergmann
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Rawmakase:
    type: application
    platform: iOS
    sources:
      - app/Sources
      - app/Generated
    # A full-size decode of a 45 MP RAW and its 100% view need more than the
    # default limit on an 8 GB iPad (MEASUREMENTS.md).
    entitlements:
      path: app/Rawmakase.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - framework: build/RawmakaseCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ljbergmann.rawmakase-ipad
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Finder (and the Files app) can put photos in the app's Documents.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
