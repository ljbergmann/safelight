name: Safelight
options:
  bundleIdPrefix: com.leonjbergmann
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Safelight:
    type: application
    platform: iOS
    sources:
      - app/Sources
      - app/Generated
      # The app icon, drawn by scripts/render-icon.swift from docs/brand.
      - app/Assets.xcassets
      # What the App Store asks the app to declare, and the licences it ships
      # (scripts/acknowledgements.py).
      - app/PrivacyInfo.xcprivacy
      - app/Acknowledgements.txt
      # AI Denoise on the Neural Engine (app/Models/README.md); Xcode compiles
      # it into RawNIND-ANE.mlmodelc, which the core loads by name.
      - app/Models/RawNIND-ANE.mlpackage
      # Select Sky on the Neural Engine, made by scripts/convert-sky-ane.py
      # (233 MB, too large for the repository). Without it, Sky runs on the
      # CPU with the downloaded model, as before.
      - path: build/Sky-ANE.mlpackage
        optional: true
      # Select Subject's SAM 2 encoder and DETR on the GPU, made by
      # scripts/convert-subject-coreml.py (161 MB). Without it, they run on the CPU.
      - path: build/Subject-CoreML.mlpackage
        optional: true
    # A full-size decode of a 45 MP RAW and its 100% view need more than the
    # default limit on an 8 GB iPad (MEASUREMENTS.md).
    entitlements:
      path: app/Safelight.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - framework: build/SafelightCore.xcframework
        embed: false
      # The core runs AI Denoise with Core ML (core/src/neural_denoise.rs).
      - sdk: CoreML.framework
      # ONNX Runtime, for AI Denoise and the AI masks. The core opens it by
      # path at run time, so it is embedded but not linked
      # (scripts/build-ort.sh).
      - framework: build/onnxruntime.xcframework
        embed: true
        link: false
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonjbergmann.safelight
        # The core runs the bundled Core ML model; no Swift class is wanted.
        COREML_CODEGEN_LANGUAGE: None
        INFOPLIST_KEY_CFBundleDisplayName: Safelight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad first; on an iPhone the photo sits above the panel.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Finder (and the Files app) can put photos in the app's Documents.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # Only the system's standard encryption (HTTPS downloads), which
        # needs no export documentation.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Importing uses the system's picker; only a RAW+JPEG pair's RAW needs
        # read access (PhotosImport.swift). Save to Device adds to the library.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Safelight reads the RAW file of a RAW+JPEG photo you pick to import, which the picker doesn't hand over."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Safelight saves the photos you export to your library when you choose Save to Device."
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "11"
